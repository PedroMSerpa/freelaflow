name: Relatar problema
description: Descreva um erro reproduzível no aplicativo.
title: '[Bug]: '
body:
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Inclua a tela, os passos e o resultado observado. Use dados fictícios.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador e dispositivo
